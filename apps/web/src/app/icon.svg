<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#090d16"/>
  <!-- Lens ring -->
  <circle cx="16" cy="16" r="11" stroke="#0284c7" stroke-width="2.5" fill="none"/>
  <!-- Inner lens -->
  <circle cx="16" cy="16" r="6" fill="#0284c7" fill-opacity="0.25"/>
  <!-- Crosshair lines -->
  <line x1="16" y1="5" x2="16" y2="10" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="22" x2="16" y2="27" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <line x1="5" y1="16" x2="10" y2="16" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="16" x2="27" y2="16" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2.5" fill="#38bdf8"/>
</svg>
